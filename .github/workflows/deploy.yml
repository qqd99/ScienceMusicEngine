name: Deploy Science Music Engine
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Configure C++ intelligence core
        run: cmake -S cpp -B build/cpp -DCMAKE_BUILD_TYPE=Release
      - name: Build C++ intelligence core
        run: cmake --build build/cpp --parallel 2
      - name: Test C++ intelligence core
        run: ctest --test-dir build/cpp --output-on-failure
      - name: Smoke-test symbolic score generator
        run: ./build/cpp/science_music_demo --seed 42 --collection black --mode auto --output build/cpp/demo-score.csv
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment